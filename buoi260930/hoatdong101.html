<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoạt động 101 - Bố cục CSS Grid</title>
    <!-- Nhúng CSS định dạng external -->
    <link rel="stylesheet" href="hoatdong101.css">
</head>
<body>
    <!-- Container chứa lưới CSS Grid -->
    <div class="grid-container">
        <!-- Các cột nội dung -->
        <div class="card">
            <h3>Cột 1</h3>
            <p>Đây là nội dung của cột đầu tiên. Các cột đều có chiều rộng bằng nhau nhờ CSS Grid.</p>
        </div>
        
        <div class="card">
            <h3>Cột 2</h3>
            <p>Đây là nội dung của cột thứ hai. Khoảng cách (gap) giữa các thẻ là 20px.</p>
        </div>
        
        <div class="card">
            <h3>Cột 3</h3>
            <p>Đây là nội dung của cột thứ ba. Thẻ có nền xám nhạt và được bo góc 10px đẹp mắt.</p>
        </div>
    </div>
</body>
</html>
